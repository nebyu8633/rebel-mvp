services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoice_guard
      POSTGRES_PASSWORD: invoice_guard
      POSTGRES_DB: invoice_guard
    ports:
      - "5432:5432"
    volumes:
      - invoice_guard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice_guard -d invoice_guard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://invoice_guard:invoice_guard@db:5432/invoice_guard
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  invoice_guard_pgdata:
